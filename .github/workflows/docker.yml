name: Docker

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Build, sandboxed render and persistent workspace
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      ARTIFACT_STUDIO_DOCKER_TESTS: "1"
      ARTIFACT_STUDIO_IMAGE: artifact-studio:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.14"
          enable-cache: true
          cache-suffix: docker
      - run: uv sync --locked
      - name: Build image without publishing
        run: docker build --tag artifact-studio:ci .
      - name: Test the shipped Compose configuration
        run: uv run --no-sync pytest tests/integration/test_docker.py --junitxml=test-results/docker.xml
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-results
          path: test-results/docker.xml
          retention-days: 1
