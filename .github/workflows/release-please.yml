name: Release Please

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      command:
        description: Prepare a release PR, or publish the merged release PR
        type: choice
        options: [prepare, publish]
        default: prepare
        required: true

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release PR (no publication)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.command == 'prepare')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
      # PRs created with GITHUB_TOKEN do not trigger pull_request workflows.
      # workflow_dispatch does, and records CI against the generated PR's commit.
      - name: Run CI on the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR: ${{ fromJSON(steps.release.outputs.pr || '{}').number }}
        run: |
          branch=$(gh pr view "$RELEASE_PR" --json headRefName --jq .headRefName)
          gh workflow run ci.yml --ref "$branch"

  publish:
    name: Publish merged release
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.command == 'publish') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.id == github.event.repository.id))
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Require successful CI for main and pending releases
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          AUTOMATIC: ${{ github.event_name == 'workflow_run' }}
        run: |
          current=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$current" != "$RELEASE_SHA" ]; then
            echo "Main changed after this run was requested. Run Publish again after its CI passes."
            if [ "$AUTOMATIC" = true ]; then exit 0; fi
            exit 1
          fi
          result=$(gh run list --workflow ci.yml --commit "$RELEASE_SHA" --branch main --event push \
            --limit 1 --json conclusion --jq '.[0].conclusion // "missing"')
          if [ "$result" != success ]; then
            echo "Wait for CI to pass on main before publishing (current result: $result)."
            exit 1
          fi
          release_commits=$(gh pr list --state merged --base main --label 'autorelease: pending' \
            --limit 200 --json mergeCommit --jq '.[] | .mergeCommit.oid // "missing"')
          if [ -z "$release_commits" ]; then
            echo "No merged release PR is pending. Merge the release PR before publishing."
            if [ "$AUTOMATIC" = true ]; then exit 0; fi
            exit 1
          fi
          while IFS= read -r release_commit; do
            if [[ ! "$release_commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "A pending release PR has an invalid merge commit; cannot verify its CI."
              exit 1
            fi
            result=$(gh run list --workflow ci.yml --commit "$release_commit" --branch main --event push \
              --limit 1 --json conclusion --jq '.[0].conclusion // "missing"')
            if [ "$result" != success ]; then
              echo "Wait for CI to pass on release commit $release_commit before publishing (current result: $result)."
              exit 1
            fi
          done <<< "$release_commits"
          current=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$current" != "$RELEASE_SHA" ]; then
            echo "Main changed after this run was requested. Run Publish again after its CI passes."
            if [ "$AUTOMATIC" = true ]; then exit 0; fi
            exit 1
          fi
          {
            echo "publish=true"
            echo "release_sha=$RELEASE_SHA"
            echo "verified<<VERIFIED_SHAS"
            printf '%s\n' "$release_commits"
            echo "VERIFIED_SHAS"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.publish == 'true'
        with:
          ref: ${{ steps.guard.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.guard.outputs.publish == 'true'
        with:
          node-version: "24"
      - name: Install locked release tooling
        if: steps.guard.outputs.publish == 'true'
        run: npm ci --ignore-scripts --prefix scripts/release
      - name: Publish verified release plan
        if: steps.guard.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.guard.outputs.release_sha }}
          VERIFIED_SHAS: ${{ steps.guard.outputs.verified }}
        run: |
          current=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$current" != "$RELEASE_SHA" ]; then
            echo "Main changed after validation; run Publish again after CI passes."
            exit 1
          fi
          node scripts/release/publish.js
