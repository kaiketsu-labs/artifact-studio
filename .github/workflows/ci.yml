name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SLIDE_STUDIO_COLLECTION: .state/ci/presentations
  SLIDE_STUDIO_DATABASE: .state/ci/review.sqlite3
  SLIDE_STUDIO_ARTIFACTS: test-results/integration

jobs:
  quality:
    name: Ruff, types and unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.23"
          python-version: "3.14"
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: uv sync --locked
      - name: Ruff lint
        run: uv run --no-sync ruff check studio tests
      - name: Ruff formatting
        run: uv run --no-sync ruff format --check studio tests
      - name: Strict type checks
        run: uv run --no-sync basedpyright
      - name: Python tests
        run: uv run --no-sync pytest --junitxml=test-results/unit.xml
      - name: Frontend behavior tests
        run: node --test tests/*.cjs
      - name: JavaScript syntax
        run: |
          git ls-files '*.js' '*.cjs' | while IFS= read -r file; do
            node --check "$file" || exit 1
          done
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unit-results
          path: test-results/
          retention-days: 7

  browser:
    name: Playwright user journeys and rendering
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      SLIDE_STUDIO_BROWSER_TESTS: "1"
      SLIDE_STUDIO_RENDER_TESTS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.23"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - name: Install Chromium and OS dependencies
        run: uv run --no-sync playwright install --with-deps chromium --only-shell
      - name: Browser journeys and sandboxed renderer tests
        run: >-
          uv run --no-sync pytest
          tests/integration/test_browser.py tests/integration/test_chat.py tests/integration/test_questions.py tests/integration/test_zoom.py tests/integration/test_sections.py tests/integration/test_feedback_delivery.py tests/integration/test_audience_preview.py tests/integration/test_design_references.py tests/test_visuals.py
          tests/test_interactive.py tests/test_element_rotation_dom.py
          --junitxml=test-results/browser.xml
      - name: Upload screenshots, Playwright traces and server logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-results
          path: test-results/
          retention-days: 7

  agents:
    name: Agent integration (${{ matrix.harness }})
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: codex
            package: "@openai/codex@0.166.0"
          - harness: claude-code
            package: "@anthropic-ai/claude-code@2.1.316"
    env:
      SLIDE_STUDIO_AGENT_TESTS: "1"
      SLIDE_STUDIO_NATIVE_CLIENT_TESTS: "1"
      SLIDE_STUDIO_NATIVE_CLIENT: ${{ matrix.harness }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.23"
          python-version: "3.14"
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: uv sync --locked
      - name: Install pinned native agent CLI
        run: npm install --global --no-audit --no-fund '${{ matrix.package }}'
      - name: MCP protocol, guarded edits, native configuration and real hook launchers
        run: >-
          uv run --no-sync pytest tests/integration/test_agents.py tests/integration/test_authoring_recovery.py
          tests/integration/test_native_clients.py tests/integration/test_slide_insertion.py
          --junitxml=test-results/agents.xml
      - name: Upload client versions, hook output and server logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: agent-results-${{ matrix.harness }}
          path: test-results/
          retention-days: 7
