name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ARTIFACT_STUDIO_COLLECTION: .state/ci/presentations
  ARTIFACT_STUDIO_DATABASE: .state/ci/review.sqlite3
  ARTIFACT_STUDIO_ARTIFACTS: test-results/integration

jobs:
  scope:
    name: Select platform checks
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    outputs:
      docker: ${{ steps.scope.outputs.docker }}
      macos: ${{ steps.scope.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci/scope.cjs

  audit:
    uses: ./.github/workflows/dependency-audit.yml

  docker:
    needs: scope
    if: needs.scope.outputs.docker == 'true'
    uses: ./.github/workflows/docker.yml

  macos:
    needs: scope
    if: needs.scope.outputs.macos == 'true'
    uses: ./.github/workflows/macos.yml

  safety:
    name: Dependency safety
    if: always()
    needs: [scope, quality, browser, agents, audit, docker, macos]
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci/gate.cjs

  quality:
    name: Ruff, types, unit tests & release simulation
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.23"
          python-version: "3.14"
          enable-cache: true
          cache-suffix: "quality"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            scripts/release/package-lock.json
            scripts/text-editor/package-lock.json
      - run: uv sync --locked
      - name: Verify the shipped offline editor matches its lockfile
        run: |
          npm ci --prefix scripts/text-editor --ignore-scripts --no-audit --no-fund
          npm run --prefix scripts/text-editor build
          node scripts/text-editor/check.mjs
      - name: Ruff lint
        run: uv run --no-sync ruff check artifact_studio tests
      - name: Ruff formatting
        run: uv run --no-sync ruff format --check artifact_studio tests
      - name: Strict type checks
        run: uv run --no-sync basedpyright
      - name: Python unit tests
        run: >-
          uv run --no-sync pytest -n 2 --dist worksteal --max-worker-restart=0
          --durations=15 --junitxml=test-results/unit.xml
      - name: Frontend behavior tests
        run: node --test tests/*.cjs
      - name: JavaScript syntax
        run: |
          git ls-files '*.js' '*.cjs' | while IFS= read -r file; do
            node --check "$file" || exit 1
          done
      - name: Release version simulations
        run: |
          npm ci --prefix scripts/release --ignore-scripts --no-audit --no-fund
          node --test scripts/release/*.cjs
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unit-results
          path: test-results/
          retention-days: 1

  browser:
    name: Playwright user journeys and rendering (${{ matrix.suite }})
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: editor
            browsers: chromium
            tests: >-
              tests/integration/test_browser.py tests/integration/test_chat.py tests/integration/test_questions.py tests/integration/test_zoom.py tests/integration/test_quick_access.py tests/integration/test_app_version.py
              tests/integration/test_sections.py tests/integration/test_feedback_delivery.py tests/integration/test_audience_preview.py
              tests/integration/test_notes_and_backup.py tests/integration/test_editor_layout.py tests/integration/test_sorter_header.py
              tests/integration/test_structural_undo.py tests/integration/test_element_commands.py tests/integration/test_group_object_commands.py
              tests/integration/test_slide_context_menus.py tests/integration/test_voice_rich.py tests/integration/test_voice_presenter.py
              tests/integration/test_sharing_render.py tests/integration/test_feedback_mode_sync.py tests/integration/test_element_mode_guard.py
              tests/integration/test_slide_designs.py tests/integration/test_element_alternatives.py
              tests/integration/test_element_alternative_layout.py tests/integration/test_element_alternative_motion.py
              tests/integration/test_presentation_displays.py tests/integration/test_rail_previews.py tests/integration/test_design_dialog_lifecycle.py
          - suite: runtime
            browsers: chromium firefox
            tests: >-
              tests/integration/test_design_references.py tests/integration/test_design_library.py tests/integration/test_object_selection.py
              tests/integration/test_artifact_workspace.py tests/integration/test_artifact_sorting.py tests/integration/test_snapshot_inventory.py tests/integration/test_element_properties.py
              tests/integration/test_element_properties_layout.py tests/integration/test_native_sharing.py tests/integration/test_hub_context_menus.py
              tests/integration/test_version_recovery.py tests/integration/test_voice_input.py tests/integration/test_voice_hub.py
              tests/integration/test_full_backup_ui.py tests/integration/test_library_previews.py tests/integration/test_favorites.py tests/integration/test_favorite_preview_lifecycle.py tests/integration/test_chat_references.py tests/integration/test_reference_pill_previews.py
              tests/integration/test_artifact_downloads.py tests/integration/test_project_tree.py tests/integration/test_sharing_workspace.py
              tests/integration/test_ui_contrast.py tests/integration/test_accessible_labels.py tests/integration/test_marquee_export.py
              tests/integration/test_presentation_authoring.py tests/integration/test_agent_workflow_gaps.py
              tests/integration/test_audit_followups.py tests/test_text_review.py tests/test_visuals.py tests/test_interactive.py
              tests/test_presentation_authoring.py tests/test_element_rotation_dom.py tests/test_copilot_capture.py
              tests/test_element_alternative_tools.py tests/test_hub_cover_rendering.py tests/test_sharing_renderer.py
    env:
      ARTIFACT_STUDIO_BROWSER_TESTS: "1"
      ARTIFACT_STUDIO_RENDER_TESTS: "1"
      ARTIFACT_STUDIO_TEST_BROWSER: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.23"
          python-version: "3.14"
          enable-cache: true
          cache-suffix: "browser-${{ matrix.suite }}"
      - run: uv sync --locked
      - name: Cache Playwright browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ matrix.suite }}-${{ hashFiles('.venv/lib/python*/site-packages/playwright/driver/package/browsers.json') }}
      - name: Install browser OS dependencies
        run: uv run --no-sync playwright install-deps ${{ matrix.browsers }}
      - name: Install text review engine
        if: matrix.suite == 'runtime'
        run: sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Install pinned browsers on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run --no-sync playwright install --only-shell ${{ matrix.browsers }}
      - name: Save browsers before running tests
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - name: Browser journeys and sandboxed renderer tests
        run: >-
          uv run --no-sync pytest -n 2 --dist worksteal --max-worker-restart=0 ${{ matrix.tests }}
          --durations=15
          --junitxml=test-results/browser-${{ matrix.suite }}.xml
      - name: Firefox presentation journeys
        if: matrix.suite == 'runtime'
        env:
          ARTIFACT_STUDIO_TEST_BROWSER: firefox
        run: >-
          uv run --no-sync pytest -n 2 --dist worksteal --max-worker-restart=0
          tests/integration/test_presentation_displays.py --durations=15
          --junitxml=test-results/browser-firefox.xml
      - name: Upload screenshots, Playwright traces and server logs on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-results-${{ matrix.suite }}
          path: test-results/
          retention-days: 1

  agents:
    name: Agent integration
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      ARTIFACT_STUDIO_AGENT_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.23"
          python-version: "3.14"
          enable-cache: true
          cache-suffix: "agents"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: uv sync --locked
      - name: Install pinned native agent CLIs
        run: npm install --global --no-audit --no-fund '@openai/codex@0.166.0' '@anthropic-ai/claude-code@2.1.316'
      - name: MCP protocol, guarded edits, authoring recovery and slide insertion
        run: >-
          uv run --no-sync pytest tests/integration/test_agents.py tests/integration/test_authoring_recovery.py
          tests/integration/test_slide_insertion.py
          --junitxml=test-results/agents.xml
      - name: Native Codex and Claude Code clients
        env:
          ARTIFACT_STUDIO_NATIVE_CLIENT_TESTS: "1"
        run: uv run --no-sync pytest tests/integration/test_native_clients.py --junitxml=test-results/native-clients.xml
      - name: Upload client logs on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: agent-results
          path: test-results/
          retention-days: 1
