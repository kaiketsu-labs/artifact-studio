name: Dependency audit

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * *'

permissions:
  contents: read

jobs:
  audit:
    name: Audit Python and npm lockfiles
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.23"
          python-version: "3.14"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Audit Python including development and Linux-only packages
        run: uv audit --locked --preview-features audit-command --python-platform linux
      - name: Audit Python including macOS-only packages
        if: '!cancelled()'
        run: uv audit --locked --preview-features audit-command --python-platform macos
      - name: Audit Python including Windows-only packages
        if: '!cancelled()'
        run: uv audit --locked --preview-features audit-command --python-platform windows
      - name: Audit release tooling including transitive packages
        if: '!cancelled()'
        run: npm audit --prefix scripts/release --package-lock-only
      - name: Audit editor including transitive packages
        if: '!cancelled()'
        run: npm audit --prefix scripts/text-editor --package-lock-only
