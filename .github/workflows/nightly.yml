name: Nightly release

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-release-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.23'
          python-version: '3.14'
      - name: Publish only changed, tested source as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_REPOSITORY: ${{ github.repository }}
          NIGHTLY_COMMIT: ${{ github.sha }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
        run: >-
          uv run --no-project --python 3.14 -m scripts.publish_nightly
          --repository "$NIGHTLY_REPOSITORY" --commit "$NIGHTLY_COMMIT"
          --run-number "$NIGHTLY_RUN_NUMBER"
