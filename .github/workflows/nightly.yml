name: Nightly release

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-release-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.23'
          python-version: '3.14'
      - name: Publish only changed, tested source as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_REPOSITORY: ${{ github.repository }}
          NIGHTLY_COMMIT: ${{ github.sha }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
        run: >-
          uv run --no-project --python 3.14 -m scripts.publish_nightly
          --repository "$NIGHTLY_REPOSITORY" --commit "$NIGHTLY_COMMIT"
          --run-number "$NIGHTLY_RUN_NUMBER"
