<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentation</title><link rel="stylesheet" href="theme.css"></head><body>
<div class="deck-app"><header class="deck-toolbar"><span class="deck-title">Presentation</span><button id="previous" aria-label="Previous slide">←</button><span class="deck-counter" id="counter"></span><button id="next" aria-label="Next slide">→</button><button id="notes-button">Notes</button><button id="sources-button">Sources</button><button id="present-button">Present</button><button id="audience-fullscreen" hidden>Fullscreen</button></header><div class="deck-message" id="message" role="status"></div><main class="stage-wrap" id="normal-view"><div class="stage-slot" id="stage"></div></main><nav class="deck-dots" id="dots" aria-label="Slide navigation"></nav><main id="presenter-view" class="presenter-board" hidden><section><h2>Current slide</h2><div class="stage-slot" id="presenter-current"></div></section><section><h2>Up next</h2><div class="stage-slot" id="presenter-next"></div><h2>Speaker notes</h2><textarea id="presenter-notes" aria-label="Speaker notes"></textarea></section></main></div>
<dialog id="notes-dialog" class="deck-dialog"><header><h2>Speaker notes</h2><button data-close="notes-dialog">Close</button></header><textarea id="notes-text" aria-label="Edit speaker notes"></textarea><p id="notes-hint"></p></dialog><dialog id="sources-dialog" class="deck-dialog"><header><h2>Sources</h2><button data-close="sources-dialog">Close</button></header><div id="sources-list"></div></dialog>
<script id="deck-data" type="application/json">{{DECK_JSON}}</script><script src="icons.js"></script><script src="presentation.js"></script></body></html>
