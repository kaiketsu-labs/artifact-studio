<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="212" viewBox="0 0 1120 212" role="img" aria-labelledby="title desc">
  <title id="title">From brief to presentation</title>
  <desc id="desc">A brief and reference go to an agent draft, then human review and refinement, then presentation. Review can return to the draft.</desc>
  <rect x="1" y="1" width="1118" height="210" rx="18" fill="#f7f9fe" stroke="#e0e6f0"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#172b49">
    <g transform="translate(45 37)">
      <rect width="45" height="45" rx="12" fill="#e4eaff"/>
      <g fill="none" stroke="#345bff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="15" y="10" width="17" height="25" rx="2"/><path d="M20 17h7m-7 6h7m-7 6h4"/></g>
      <text y="78" font-size="20" font-weight="700">Brief &amp; reference</text>
      <text y="102" font-size="14" fill="#65748a">Your audience. Your design.</text>
    </g>
    <g transform="translate(323 37)">
      <rect width="45" height="45" rx="12" fill="#345bff"/>
      <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><rect x="10" y="13" width="26" height="20" rx="2"/><path d="M18 13v20m5-13h7m-7 6h5"/></g>
      <text y="78" font-size="20" font-weight="700">Agent draft</text>
      <text y="102" font-size="14" fill="#65748a">Slides, visuals and context.</text>
    </g>
    <g transform="translate(601 37)">
      <rect width="45" height="45" rx="12" fill="#d5f4e9"/>
      <g fill="none" stroke="#236d54" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12h26v19H22l-7 6v-6h-5z"/><path d="m16 21 5 5 10-10"/></g>
      <text y="78" font-size="20" font-weight="700">Review &amp; refine</text>
      <text y="102" font-size="14" fill="#65748a">Point. Comment. Approve.</text>
    </g>
    <g transform="translate(878 37)">
      <rect width="45" height="45" rx="12" fill="#e4eaff"/>
      <g fill="none" stroke="#345bff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12h28M11 12v18h24V12M22 30v8m-6 0 6-8 6 8"/><path d="m20 17 7 4-7 4z"/></g>
      <text y="78" font-size="20" font-weight="700">Present</text>
      <text y="102" font-size="14" fill="#65748a">Slides out. Notes private.</text>
    </g>
  </g>
  <g fill="none" stroke="#9cacc5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M259 80h32m-7-7 7 7-7 7M537 80h32m-7-7 7 7-7 7M815 80h32m-7-7 7 7-7 7"/><path d="M725 159v17H434v-17" stroke-dasharray="4 5"/><path d="m428 164 6-6 6 6"/></g>
</svg>
