<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved presentations · Artifact Studio</title><link rel="stylesheet" href="/web/offline.css"><script src="/web/offline-store.js" defer></script><script src="/web/offline-client.js" defer></script><script src="/web/offline-shell.js" defer></script></head>
<body><main><header><h1>Saved presentations</h1><button id="clear" type="button">Clear saved data</button></header><p id="status" role="status"></p><label>Presentation <select id="decks"></select></label><label>Slide <select id="slides"></select></label><iframe id="preview" title="Slide preview" sandbox></iframe><label for="source">Slide HTML</label><textarea id="source" rows="12" autocomplete="off" disabled></textarea><button id="save-edit" type="button" disabled>Save edit for later</button><label for="comment">Comment</label><textarea id="comment" rows="4" autocomplete="off" disabled></textarea><button id="save-comment" type="button" disabled>Save comment for later</button><p>Changes are kept on this device until you reconnect and review them.</p><button id="reconnect" type="button">Reconnect and review</button><section id="conflict" hidden aria-labelledby="conflict-title"><h2 id="conflict-title">Choose a version</h2><p>The same slide changed while you were offline.</p><h3>Original</h3><pre id="conflict-base"></pre><h3>Current online version</h3><pre id="conflict-current"></pre><h3>Your offline edit</h3><pre id="conflict-draft"></pre><button id="use-current" type="button">Keep online version</button><button id="use-draft" type="button">Use my offline edit</button></section></main></body></html>
