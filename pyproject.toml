[project]
name = "artifact-studio"
version = "0.3.2"
description = "Local artifact workspace for agents and human review through stateless MCP."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.35,<1",
    "mcp>=2,<3",
    "playwright>=1.55,<2",
    "pillow>=13,<14",
    "tinycss2>=1.4,<2",
]

[dependency-groups]
dev = [
    "basedpyright>=1.28",
    "ruff>=0.11",
    "pytest>=8.3",
    "httpx>=0.28",
    "types-tinycss2>=1.5.1.20260414",
    "pytest-xdist>=3.8,<4",
]

[tool.fastapi]
entrypoint = "artifact_studio.app:app"

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["artifact_studio", "tests"]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

addopts = "-q --strict-markers"
markers = [
    "docker: opt-in real container, MCP, rendering and persistence checks",
    "browser: opt-in Playwright user journeys against a real server",
    "agents: opt-in MCP transport and Codex/Claude hook subprocess checks",
    "native_clients: opt-in installed Codex/Claude CLI configuration checks",
]
